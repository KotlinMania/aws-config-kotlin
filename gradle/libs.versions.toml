[versions]
kotlin = "2.4.20"
coroutines = "1.11.0"
datetime = "0.8.0"
collectionsImmutable = "0.5.2"
androidKmp = "9.4.1"
detekt = "2.0.0-alpha.6"
ktlint = "14.2.0"
ktlintEngine = "1.8.0"
kotlinxBenchmark = "0.5.0"
awsCredentialTypes = "0.1.1"
futures = "0.2.1"
http = "0.1.3"
p256 = "0.1.0"
serde = "0.1.10"
serdeJson = "0.1.1"
sha2 = "0.1.0"
tokio = "0.1.1"
tracing = "0.1.0"
zeroize = "0.1.1"
rand = "0.1.0"

[plugins]
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
android-kmp = { id = "com.android.kotlin.multiplatform.library", version.ref = "androidKmp" }
detekt = { id = "dev.detekt", version.ref = "detekt" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint" }
kotlinx-benchmark = { id = "org.jetbrains.kotlinx.benchmark", version.ref = "kotlinxBenchmark" }
kotlin-allopen = { id = "org.jetbrains.kotlin.plugin.allopen", version.ref = "kotlin" }

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "datetime" }
collections-immutable = { module = "org.jetbrains.kotlinx:kotlinx-collections-immutable", version.ref = "collectionsImmutable" }
kotlinx-benchmark-runtime = { module = "org.jetbrains.kotlinx:kotlinx-benchmark-runtime", version.ref = "kotlinxBenchmark" }
aws-credential-types-kotlin = { module = "io.github.kotlinmania:aws-credential-types-kotlin", version.ref = "awsCredentialTypes" }
futures-kotlin = { module = "io.github.kotlinmania:futures-kotlin", version.ref = "futures" }
http-kotlin = { module = "io.github.kotlinmania:http-kotlin", version.ref = "http" }
p256-kotlin = { module = "io.github.kotlinmania:p256-kotlin", version.ref = "p256" }
serde-kotlin = { module = "io.github.kotlinmania:serde-kotlin", version.ref = "serde" }
serde-json-kotlin = { module = "io.github.kotlinmania:serde-json-kotlin", version.ref = "serdeJson" }
sha2-kotlin = { module = "io.github.kotlinmania:sha2-kotlin", version.ref = "sha2" }
tokio-kotlin = { module = "io.github.kotlinmania:tokio-kotlin", version.ref = "tokio" }
tracing-kotlin = { module = "io.github.kotlinmania:tracing-kotlin", version.ref = "tracing" }
zeroize-kotlin = { module = "io.github.kotlinmania:zeroize-kotlin", version.ref = "zeroize" }
rand-kotlin = { module = "io.github.kotlinmania:rand-kotlin", version.ref = "rand" }

[bundles]
aws-config-kotlin-commonMain = [
  "kotlinx-coroutines-core",
  "kotlinx-datetime",
  "collections-immutable",
  "aws-credential-types-kotlin",
  "http-kotlin",
  "p256-kotlin",
  "sha2-kotlin",
  "zeroize-kotlin",
]
